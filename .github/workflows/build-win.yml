name: Build — Windows EXE + MSI + macOS DMG/PKG

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Locate ffmpeg + ffprobe (resolve choco shim)
        id: ffmpeg
        shell: pwsh
        run: |
          # Choco installs ffmpeg to ProgramData with shim in bin. Find REAL exe.
          $real_ff = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*\tools\ffmpeg\bin\ffmpeg.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $real_fp = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*\tools\ffmpeg\bin\ffprobe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $real_ff) {
            # Fallback: resolve from PATH
            $real_ff = (Get-Command ffmpeg).Source
            $real_fp = (Get-Command ffprobe).Source
          }
          $ff = $real_ff.ToString()
          $fp = $real_fp.ToString()
          # Verify size > 1 MB (shims are tiny)
          $size = (Get-Item $ff).Length
          echo "ffmpeg path: $ff ($size bytes)"
          if ($size -lt 1000000) { throw "ffmpeg is shim — $size bytes. Need real binary." }
          echo "path=$ff" >> $env:GITHUB_OUTPUT
          echo "probe=$fp" >> $env:GITHUB_OUTPUT
          echo "ffprobe: $fp"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip install --upgrade yt-dlp
          pip install pyinstaller

      - name: Locate tkdnd binary
        id: tkdnd
        shell: pwsh
        run: |
          $p = python -c "import tkinterdnd2, os; print(os.path.join(os.path.dirname(tkinterdnd2.__file__), 'tkdnd'))"
          echo "path=$p" >> $env:GITHUB_OUTPUT
          dir $p

      - name: Fetch QuickJS runtime (Facebook/YouTube JS challenges)
        shell: pwsh
        run: |
          curl.exe -fsSL -o qjs.exe https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe
          dir qjs.exe

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm --clean --windowed --onefile `
            --name "ZHDownloader" `
            --icon "assets\AppIcon.ico" `
            --add-data "assets;assets" `
            --add-binary "${{ steps.ffmpeg.outputs.path }};." `
            --add-binary "${{ steps.ffmpeg.outputs.probe }};." `
            --add-data "${{ steps.tkdnd.outputs.path }};tkinterdnd2/tkdnd" `
            --collect-all tkinterdnd2 `
            --collect-all pystray `
            --collect-all PIL `
            --add-binary "qjs.exe;." `
            --hidden-import pystray._darwin `
            --hidden-import pystray._win32 `
            --hidden-import pystray._base `
            --hidden-import pythoncom `
            --hidden-import win32gui `
            --hidden-import win32com `
            --hidden-import win32com.server `
            --hidden-import win32com.server.util `
            --hidden-import win32com.server.policy `
            --copy-metadata pystray `
            --hidden-import certifi --collect-data certifi `
            zh_downloader.py

      - name: Build MSI
        shell: pwsh
        run: |
          $WIX = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' | Select-Object -First 1).FullName + '\bin'
          $env:Path = "$WIX;$env:Path"
          candle.exe -nologo -arch x64 `
            -dAppName="ZH Downloader" `
            -dAppVersion="6.6.15" `
            -dAppAuthor="ZH Motions" `
            -dExePath="dist\ZHDownloader.exe" `
            -dIconPath="assets\AppIcon.ico" `
            -out dist\installer.wixobj `
            installer.wxs
          light.exe -nologo `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            -cultures:en-us `
            -out "dist\ZHDownloader-Setup.msi" `
            dist\installer.wixobj

      # Publish straight to the Release (ephemeral artifact storage quota is full;
      # Release assets are separate + persistent). Each job appends to the same tag.
      - name: Publish Windows assets to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZHDownloader.exe
            dist/ZHDownloader-Setup.msi

  build-macos:
    runs-on: macos-14   # Sonoma -> minos 14 -> runs on macOS 14, 15 (Sequoia) and 26 (older runners give lower minos = wider client support)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python with tkinter
        run: |
          brew install python-tk@3.12 || true
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install Python deps
        run: |
          python3.12 -m pip install --upgrade -r requirements.txt --break-system-packages
          python3.12 -m pip install --upgrade yt-dlp --break-system-packages
          python3.12 -m pip install pyinstaller --break-system-packages

      - name: Build .app
        run: |
          FFMPEG_BIN="$(command -v ffmpeg)"
          FFPROBE_BIN="$(command -v ffprobe)"
          TKDND_PATH="$(python3.12 -c 'import tkinterdnd2, os; print(os.path.join(os.path.dirname(tkinterdnd2.__file__), "tkdnd"))')"
          echo "ffmpeg: $FFMPEG_BIN"
          echo "ffprobe: $FFPROBE_BIN"
          echo "tkdnd path: $TKDND_PATH"
          ls -la "$TKDND_PATH" || true
          python3.12 -m PyInstaller \
            --noconfirm --clean --windowed \
            --name "ZH Downloader" \
            --osx-bundle-identifier "com.zhmotions.downloader" \
            --icon "assets/AppIcon.icns" \
            --add-data "assets:assets" \
            --add-binary "$FFMPEG_BIN:." \
            --add-binary "$FFPROBE_BIN:." \
            --add-data "$TKDND_PATH:tkinterdnd2/tkdnd" \
            --collect-all tkinterdnd2 \
            --collect-all pystray \
            --collect-all PIL \
            --hidden-import pystray._darwin \
            --hidden-import pystray._base \
            --hidden-import AppKit \
            --hidden-import Foundation \
            --hidden-import objc \
            --copy-metadata pystray \
            --hidden-import certifi --collect-data certifi \
            zh_downloader.py

      - name: Register zhdownloader:// URL scheme
        run: |
          PLIST="dist/ZH Downloader.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.zhmotions.zhdownloader" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string zhdownloader" "$PLIST"
          echo "URL scheme registered:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Ad-hoc codesign (.app)
        # Must run AFTER the plist edit (editing invalidates any prior signature).
        # Without a signature, Apple Silicon flags the download as "damaged"; an
        # ad-hoc signature makes it the normal right-click → Open prompt instead.
        run: |
          xattr -cr "dist/ZH Downloader.app" 2>/dev/null || true
          codesign --force --deep --sign - "dist/ZH Downloader.app"
          codesign --verify --deep --strict "dist/ZH Downloader.app" && echo "signed ✓"

      - name: Build .dmg
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "ZH Downloader" \
            --window-size 540 360 \
            --icon-size 100 \
            --icon "ZH Downloader.app" 140 180 \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "ZHDownloader-macOS.dmg" \
            "dist/ZH Downloader.app" || {
              STAGE=$(mktemp -d)
              cp -R "dist/ZH Downloader.app" "$STAGE/"
              ln -s /Applications "$STAGE/Applications"
              hdiutil create -volname "ZH Downloader" \
                -srcfolder "$STAGE" -ov -format UDZO "ZHDownloader-macOS.dmg"
            }

      - name: Build .pkg
        run: |
          PKG_ROOT=$(mktemp -d)
          mkdir -p "$PKG_ROOT/Applications"
          cp -R "dist/ZH Downloader.app" "$PKG_ROOT/Applications/"
          COMP_DIR=$(mktemp -d)
          # Copy real EULA into installer resources for license screen
          RES_DIR=$(mktemp -d)
          cp EULA.txt "$RES_DIR/License.txt"
          ls -la "$RES_DIR"
          # postinstall strips the quarantine flag so the unsigned app opens WITHOUT
          # the macOS "damaged"/"can't be opened" warning after install.
          SCR=$(mktemp -d)
          printf '#!/bin/sh\n/usr/bin/xattr -cr "/Applications/ZH Downloader.app" 2>/dev/null || true\nexit 0\n' > "$SCR/postinstall"
          chmod +x "$SCR/postinstall"
          pkgbuild \
            --root "$PKG_ROOT" \
            --scripts "$SCR" \
            --identifier "com.zhmotions.downloader" \
            --version "6.6.15" \
            --install-location "/" \
            "$COMP_DIR/component.pkg"
          cat > "$COMP_DIR/dist.xml" << 'DISTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>ZH Downloader</title>
            <license file="License.txt"/>
            <domains enable_localSystem="true"/>
            <options customize="never" rootVolumeOnly="true" hostArchitectures="arm64,x86_64"/>
            <choices-outline><line choice="default"><line choice="com.zhmotions.downloader"/></line></choices-outline>
            <choice id="default"/>
            <choice id="com.zhmotions.downloader" visible="false"><pkg-ref id="com.zhmotions.downloader"/></choice>
            <pkg-ref id="com.zhmotions.downloader" version="6.6.15" onConclusion="none">component.pkg</pkg-ref>
          </installer-gui-script>
          DISTEOF
          productbuild \
            --distribution "$COMP_DIR/dist.xml" \
            --package-path "$COMP_DIR" \
            --resources "$RES_DIR" \
            --version "6.6.15" \
            "ZHDownloader-macOS.pkg"

      - name: Publish macOS assets to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZHDownloader-macOS.dmg
            ZHDownloader-macOS.pkg
